# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: publish release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          minecraft_version="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          mod_version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          loader="${GITHUB_REF_NAME##*-}"
          if [[ "$loader" == "$GITHUB_REF_NAME" ]]; then
            loader="fabric"
          fi

          release_minecraft_version="${GITHUB_REF_NAME%-*}"
          if [[ "$release_minecraft_version" == "$GITHUB_REF_NAME" ]]; then
            release_minecraft_version="$minecraft_version"
          fi

          # Some Minecraft dependencies use versions like 1.19/1.20, while our
          # release pages are grouped as 1.19.0/1.20.0 based on branch names.
          release_tag="mc${release_minecraft_version}"
          release_title="${release_minecraft_version}"
          source_jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          asset_name="SharedInventoryMod-${loader}-mc${release_minecraft_version}-${mod_version}.jar"

          if [[ -z "$source_jar" ]]; then
            echo "No release jar found in build/libs" >&2
            exit 1
          fi

          cp "$source_jar" "$asset_name"

          notes_file="$(mktemp)"
          printf '%s\n' \
            "Shared Inventory for Minecraft ${release_minecraft_version}." \
            "" \
            "Choose the jar by loader and mod version." \
            "Forge and NeoForge builds can be added to this same Minecraft-version release later." \
            > "$notes_file"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "$release_title"
          else
            gh release create "$release_tag" --target "$GITHUB_REF_NAME" --title "$release_title" --notes-file "$notes_file"
          fi

          gh release upload "$release_tag" "$asset_name" --clobber
